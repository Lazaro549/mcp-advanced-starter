name: CI

on:
  push:
    branches: [main, master, "chore/**"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
